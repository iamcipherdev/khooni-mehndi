<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Khooni Mehndi — A Desi Murder Mystery</title>
<meta name="description" content="Mehndi ki raat, qatl ka raaz. A free desi murder mystery game — read the evidence, interrogate suspects, catch lies, name the killer.">
<style>
:root{
  --paper:#f6f1e3; --paper2:#efe6cf; --card:#fffdf6; --ink:#1b140e; --muted:#6f6353;
  --red:#b3352b; --red-dark:#8c271f; --gold:#a97e2f; --line:#d9cdae; --green:#2e7d4f;
  --serif:Georgia,'Times New Roman',serif; --mono:ui-monospace,'Cascadia Mono','Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  background-image:repeating-linear-gradient(0deg, rgba(120,100,60,.028) 0 1px, transparent 1px 28px);
  padding-bottom:86px;
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px;}
header.top{
  border-bottom:3px double var(--ink); padding:18px 0 14px; margin-bottom:6px; position:relative;
}
.kicker{font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--red); text-transform:uppercase;}
h1.title{font-family:var(--serif); font-size:40px; margin:6px 0 2px; letter-spacing:.5px; line-height:1;}
.subtitle{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:15px; margin:0 0 10px;}
.case-no{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--line); display:inline-block; padding:3px 8px; border-radius:3px; background:var(--paper2);}
.progressline{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.pill{font-family:var(--mono); font-size:11px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:4px 10px;}
.pill b{color:var(--red);}
.stamp{
  display:inline-block; font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:2px;
  color:var(--red); border:2px solid var(--red); border-radius:4px; padding:3px 8px;
  transform:rotate(-4deg); text-transform:uppercase; background:rgba(179,53,43,.06); white-space:nowrap;
}
.stamp.green{color:var(--green); border-color:var(--green); background:rgba(46,125,79,.07);}
.stamp.gray{color:var(--muted); border-color:var(--muted); background:transparent;}
.screen{display:none; animation:fadein .25s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
h2.sec{font-family:var(--serif); font-size:24px; margin:22px 0 4px; border-bottom:1px solid var(--line); padding-bottom:8px;}
.sec-sub{color:var(--muted); font-size:13px; margin:0 0 14px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 15px; margin:10px 0; box-shadow:0 1px 3px rgba(60,45,20,.08);}
.card.tappable{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.card.tappable:active{transform:scale(.985);}
.card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.card h3{font-family:var(--serif); font-size:17px; margin:0 0 4px;}
.card p{margin:6px 0; font-size:14px; line-height:1.55;}
.meta{font-family:var(--mono); font-size:11px; color:var(--muted);}
.doc{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:18px; font-family:var(--mono); font-size:13.5px; line-height:1.7; white-space:pre-wrap; box-shadow:inset 0 0 40px rgba(150,120,70,.07);}
.doc-head{font-family:var(--sans); border-bottom:1px dashed var(--line); padding-bottom:10px; margin-bottom:12px;}
.btn{display:inline-block; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:var(--sans); font-weight:600; font-size:14px; padding:11px 18px; border-radius:8px; cursor:pointer; text-align:center;}
.btn:active{transform:scale(.97);}
.btn-red{background:var(--red); border-color:var(--red-dark);}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-gold{background:var(--gold); border-color:#8a6420;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0;}
.foldertabs{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; margin:0 -2px;}
.ftab{flex:0 0 auto; font-family:var(--mono); font-size:12px; background:var(--paper2); border:1px solid var(--line); border-bottom-width:3px; border-radius:8px 8px 4px 4px; padding:9px 13px; cursor:pointer; color:var(--ink);}
.ftab.active{background:var(--card); border-bottom-color:var(--red); font-weight:700;}
.ftab .cnt{color:var(--muted); font-weight:400;}
.susgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:480px){.susgrid{grid-template-columns:1fr;}}
.suscard{text-align:left; width:100%;}
.avatar{width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:20px; color:#fff; flex:0 0 auto;}
.claim{border-left:3px solid var(--line); padding:8px 12px; margin:10px 0; background:rgba(255,255,255,.5); border-radius:0 8px 8px 0; cursor:pointer;}
.claim.lie-found{border-left-color:var(--red); background:rgba(179,53,43,.06);}
.claim.true-found{border-left-color:var(--green); background:rgba(46,125,79,.06);}
.claim .ct{font-size:14px; line-height:1.5;}
.claim .chint{font-family:var(--mono); font-size:11px; color:var(--red); margin-top:6px; display:block;}
.qa{margin:12px 0;}
.qa button.q{display:block; width:100%; text-align:left; background:var(--paper2); border:1px solid var(--line); border-radius:8px; padding:11px 13px; margin:8px 0; font-size:14px; cursor:pointer; font-family:var(--sans);}
.qa button.q:disabled{opacity:.55; cursor:default;}
.qa .a{background:var(--card); border:1px dashed var(--line); border-radius:8px; padding:11px 13px; margin:-2px 0 10px; font-size:14px; line-height:1.6;}
.qa .a .who{font-family:var(--mono); font-size:11px; color:var(--red); display:block; margin-bottom:4px; letter-spacing:1px;}
nav.bottom{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom);}
nav.bottom button{flex:1; background:none; border:none; padding:9px 2px 8px; font-family:var(--sans); font-size:10.5px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;}
nav.bottom button .ic{font-size:18px;}
nav.bottom button.active{color:var(--red); font-weight:700;}
nav.bottom button .dot{position:absolute; top:6px; right:calc(50% - 20px); width:8px; height:8px; border-radius:50%; background:var(--red);}
.modal-ov{position:fixed; inset:0; background:rgba(20,12,6,.55); z-index:100; display:none; align-items:flex-end; justify-content:center;}
.modal-ov.open{display:flex;}
.modal{background:var(--paper); border-radius:16px 16px 0 0; max-width:720px; width:100%; max-height:88vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); animation:slideup .22s ease;}
@keyframes slideup{from{transform:translateY(40px); opacity:.5;} to{transform:none; opacity:1;}}
.modal h3{font-family:var(--serif); margin:0 0 8px; font-size:20px;}
.evpick{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
@media(max-width:480px){.evpick{grid-template-columns:1fr;}}
.evpick button{text-align:left; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; cursor:pointer;}
.evpick button:disabled{opacity:.45;}
.pickgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
@media(max-width:480px){.pickgrid{grid-template-columns:1fr;}}
.pick{border:2px solid var(--line); border-radius:10px; background:var(--card); padding:12px; cursor:pointer; text-align:left;}
.pick.sel{border-color:var(--red); box-shadow:0 0 0 2px rgba(179,53,43,.25);}
.pick h4{font-family:var(--serif); margin:0 0 4px; font-size:16px;}
.verdict-hero{text-align:center; padding:26px 10px 10px;}
.verdict-hero .big{font-family:var(--serif); font-size:34px; margin:10px 0 4px;}
.rankcard{border:2px dashed var(--red); border-radius:12px; padding:18px; text-align:center; background:var(--card); margin:16px 0;}
.rankcard .rk{font-family:var(--serif); font-size:26px; color:var(--red); margin:4px 0;}
.scorebreak{font-family:var(--mono); font-size:12.5px; line-height:2; text-align:left; display:inline-block; margin-top:8px;}
.solstep{margin:14px 0; padding-left:4px;}
.solstep .cite{font-family:var(--mono); font-size:11px; color:var(--red);}
.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); font-size:13.5px; padding:11px 18px; border-radius:24px; opacity:0; transition:all .25s ease; z-index:200; max-width:88vw; text-align:center; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.hintlist{margin:10px 0;}
.hintlist li{margin:8px 0; font-size:14px; line-height:1.55;}
.kv{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dotted var(--line);}
.kv span:last-child{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right;}
footer.game{margin:34px 0 10px; padding-top:14px; border-top:1px solid var(--line); font-family:var(--mono); font-size:11px; color:var(--muted); text-align:center; line-height:1.8;}
.checkline{display:flex; align-items:center; gap:8px; font-size:13px; margin:6px 0;}
.checkline .ck{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex:0 0 auto;}
.checkline.done .ck{background:var(--green); border-color:var(--green); color:#fff;}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="kicker">Case File No. 001 &bull; Lahore</div>
  <h1 class="title">Khooni Mehndi</h1>
  <p class="subtitle">Mehndi ki raat, qatl ka raaz &mdash; a desi murder mystery</p>
  <div><span class="case-no">FREE CASE &bull; NO SIGN-UP &bull; ~30 MIN</span></div>
  <div class="progressline" id="progressline"></div>
</header>
<main id="app">
  <section class="screen" id="scr-brief"></section>
  <section class="screen" id="scr-evidence"></section>
  <section class="screen" id="scr-suspects"></section>
  <section class="screen" id="scr-ask"></section>
  <section class="screen" id="scr-board"></section>
  <section class="screen" id="scr-accuse"></section>
  <section class="screen" id="scr-verdict"></section>
</main>
<footer class="game">
  KHOONI MEHNDI &mdash; an original work of fiction. All people, places &amp; events are imaginary.<br>

</footer>
</div>

{id:"e3", folder:"Forensics", title:"Forensic Lab Report — Sherbet Glass", tag:"Lab report",

{id:"e6", folder:"Photographs", title:"Torn Photograph (Areeba's clutch)", tag:"Phati tasveer",

{id:"e7", folder:"Statements", title:"Waiter Aslam ka bayan", tag:"Waiter",

{id:"e10", folder:"Records", title:"Gate Entry Log + rider ka bayan", tag:"Gate log",

{id:"e14", folder:"Records", title:"Dani ka unsent email (draft)", tag:"Draft email",

const SUSPECTS = [

const KILLER = "s4", TRUE_METHOD = 0, TRUE_MOTIVE = 0;
const RANKS = [[750,"SSP — Super Sleuth"],[600,"Inspector"],[400,"Sub-Inspector"],[250,"Constable"],[0,"Chowkidar"]];

const $ = id => document.getElementById(id);
const LSKEY = "khooni_mehndi_v1";
function freshState(){ return {examined:[], asked:{}, found:[], verified:[], pinned:[], hints:[], accused:null, method:null, motive:null, done:false}; }
function loadState(){ try{ const s = JSON.parse(localStorage.getItem(LSKEY)); return (s && s.examined) ? s : freshState(); }catch(e){ return freshState(); } }
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} }

/* ---------- pure logic (testable, no DOM) ---------- */
function getEv(eid){ return EVIDENCE.find(e=>e.id===eid); }
function getSus(sid){ return SUSPECTS.find(s=>s.id===sid); }
function getClaim(cid){ for(const s of SUSPECTS){ const c = s.claims.find(c=>c.id===cid); if(c) return {claim:c, sus:s}; } return null; }
function totalQuestions(){ return SUSPECTS.reduce((n,s)=>n+s.questions.length,0); }
function askedCount(st){ return Object.values(st.asked).reduce((n,a)=>n+a.length,0); }
function canAccuse(st){ return st.examined.length>=EVIDENCE.length && askedCount(st)>=totalQuestions(); }
function checkChallenge(st, cid, eid){
  const g = getClaim(cid); if(!g) return {result:"bad"};
  if(st.found.includes(cid)) return {result:"already"};
  if(!g.claim.lie){ if(!st.verified.includes(cid)) st.verified.push(cid); return {result:"true-claim"}; }
  if(g.claim.contra===eid){ st.found.push(cid); return {result:"hit", points:100}; }
  return {result:"miss"};
}
function calcVerdict(st){
  let score = st.found.length*100 - st.hints.length*25;
  const brk = [{label:"Jhoot pakray ("+st.found.length+"/5)", pts:st.found.length*100}];
  if(st.hints.length) brk.push({label:"Hints ("+st.hints.length+")", pts:-st.hints.length*25});
  const killerOk = st.accused===KILLER, methodOk = st.method===TRUE_METHOD, motiveOk = st.motive===TRUE_MOTIVE;
  if(killerOk){ score+=200; brk.push({label:"Qatil durust", pts:200}); }
  if(methodOk){ score+=50; brk.push({label:"Tareeqa durust", pts:50}); }
  if(motiveOk){ score+=50; brk.push({label:"Motive durust", pts:50}); }
  score = Math.max(0, score);
  let rank = RANKS[RANKS.length-1][1];
  for(const [min,r] of RANKS){ if(score>=min){ rank=r; break; } }
  return {killerOk, methodOk, motiveOk, score, rank, brk};
}
function progressInfo(st){
  return {ev:st.examined.length+"/"+EVIDENCE.length, q:askedCount(st)+"/"+totalQuestions(), lies:st.found.length+"/5", hints:(3-st.hints.length)+" left"};
}

    <div class="pickgrid" id="pk-mot">${MOTIVES.map((m,i)=>`<button class="pick ${S.motive===i?'sel':''}" data-a="mot" data-v="${i}"><h4 style="font-size:14px;">${m}</h4></button>`).join("")}</div>
    <div class="btn-row"><button class="btn btn-red" id="do-accuse" ${(S.accused!==null&&S.method!==null&&S.motive!==null)?"":"disabled"}>⚖️ ILZAAM LAGAO</button></div>
    <p class="meta">Qatil durust = 200 pts &bull; Tareeqa = 50 &bull; Motive = 50. Ghalat ilzaam par bhi khel khatam — magar score bachta hai.</p>`;
  }
  $("scr-accuse").innerHTML=html;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a, v=b.dataset.v;
    if(a==="sus") S.accused=v; else if(a==="met") S.method=+v; else S.motive=+v;
    save(); renderAccuse();
  });
  const da=$("do-accuse");
  if(da) da.onclick=()=>{
    openModal(`<span class="stamp">Aakhri mauqa</span><h3 style="margin:8px 0;">Pakka ilzaam lagana hai?</h3>
    <p>Tum keh rahe ho: <b>${getSus(S.accused).name}</b> ne <b>${METHODS[S.method]}</b> se, <b>${MOTIVES[S.motive]}</b> ki wajah se qatl kiya. Is ke baad koi wapsi nahi.</p>
    <div class="btn-row"><button class="btn btn-red" id="m-confirm">Haan, ilzaam lagao</button><button class="btn btn-ghost" onclick="closeModal()">Abhi nahi</button></div>`);
    $("m-confirm").onclick=()=>{ S.done=true; save(); closeModal(); show("verdict"); renderProgress(); };
  };
}
function renderVerdict(){
  const v=calcVerdict(S), ks=getSus(KILLER);
  const shareTxt=`Maine KHOONI MEHNDI solve kiya!\nRank: ${v.rank} (${v.score} pts)\nJhoot pakray: ${S.found.length}/5\n${v.killerOk?"Qatil bhi pakra ✔":"Qatil ghalat ✘"}\nTum kar sakte ho?`;
  $("scr-verdict").innerHTML=`
  <div class="verdict-hero">
    ${v.killerOk?'<span class="stamp green" style="font-size:14px;">Case Solved</span>':'<span class="stamp" style="font-size:14px;">Ghalat Ilzaam</span>'}
    <div class="big">${v.killerOk?"Qatil pakra gaya!":"Qatil azaad ghoom raha hai…"}</div>
    <p class="meta">Tumhara ilzaam: <b>${getSus(S.accused).name}</b> &bull; Asal qatil: <b>${ks.name}</b></p>
  </div>
  <div class="rankcard">
    <div class="meta">TUMHARA RANK</div>
    <div class="rk">${v.rank}</div>
    <div class="scorebreak">${v.brk.map(b=>`${b.label} .... ${b.pts>0?"+":""}${b.pts}`).join("<br>")}<br><b>TOTAL .... ${v.score} pts</b></div>
    <div class="btn-row" style="justify-content:center;"><button class="btn btn-gold" id="share-btn">📤 Rank share karo</button></div>
  </div>
  <h2 class="sec">Poori kahani — cited solution</h2>
  <div class="card solstep"><h3>🔪 Qatil: ${ks.name} (${ks.role})</h3>
    <p>Kami ne 3 mah me company se <b>Rs. 2.3 crore</b> churaye <span class="cite">[e13 bank statements]</span>. Dani ne mehndi wali shaam 5:40 PM par email draft kiya: <i>“Shaadi ke baad hum police ke paas jayenge”</i> <span class="cite">[e14]</span>. Sharmindagi aur jail ke dar ne dosti ko qatl me badal diya.</p></div>
  <div class="card solstep"><h3>☠️ Tareeqa: neend ki goliyan sherbet me</h3>
    <p>Kami ki apni prescription — <b>Zolpidem 10mg, 30 tablets</b>; gari se mili botal me 8 ghaib <span class="cite">[e15]</span>. Lab ne glass me isi brand ki <b>pisi hui scored tablets</b> payin <span class="cite">[e3]</span>. 9:38–9:45 jab waiter break par tha, Kami ne goliyan Dani ke kewra-sherbet me milayen <span class="cite">[e7]</span>. Meetha sherbet karwahat chhupa gaya; maut 10:45–11:15 ke darmiyan <span class="cite">[e4]</span>.</p></div>
  <div class="card solstep"><h3>🤥 Jhooti alibi — do azaad saboot</h3>
    <p>Kami ka dawa: <i>“dance floor par tha.”</i> Magar <b>9:42 PM ki photo</b> use drinks table ke paas dikhati hai <span class="cite">[e5]</span> — aur <b>waiter</b> ne use wahin dekha <span class="cite">[e7]</span>. Do azaad saboot, ek hi jhoot.</p></div>
  <div class="card solstep"><h3>✅ Be-gunah kyun bachte hain</h3>
    <p><b>Areeba</b> — 9:30–10:05 musalsal stage par, camera kabhi band nahi hua <span class="cite">[e12]</span>.<br>
    <b>Bilal</b> — jhagra hua tha (usne chhupaya), magar 9:38–9:52 DJ se phone par, tower location farmhouse <span class="cite">[e11]</span>.<br>
    <b>Sana</b> — dhamki di thi (gussa), magar 9:35–9:55 main gate par delivery le rahi thi <span class="cite">[e10]</span>.<br>
    <b>Farah</b> — 9:30–10:00 kitchen me, teen gawah <span class="cite">[e8]</span>; neend ki goliyon tak rasai hi nahi.</p></div>
  <div class="card" style="background:var(--paper2);"><p class="meta" style="font-size:13px; line-height:1.7;">💡 <b>Sabaq:</b> Sana aur Bilal ne jhoot bola tha — magar jhoot qatl nahi hota. Asal detective <b>motive + means + opportunity</b> teenon jorta hai.</p></div>
  <div class="btn-row"><button class="btn" onclick="if(confirm('Nayi shuruaat? Score reset ho jayega.')){localStorage.removeItem(LSKEY);location.reload();}">🔄 Dobara khelo</button></div>`;
  $("share-btn").onclick=async()=>{
    try{ await navigator.clipboard.writeText(shareTxt); toast("📋 Copy ho gaya — doston ko bhejo!"); }
    catch(e){ openModal(`<h3>Share karo</h3><div class="doc">${shareTxt}</div><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Band karo</button></div>`); }
  };
}
function showHint(){
  const left=[0,1,2].filter(i=>!S.hints.includes(i));
  if(!left.length){ toast("Hints khatam! Ab khud detective bano 🔍"); return; }
  openModal(`<span class="stamp gray">Hint</span><h3 style="margin:8px 0;">Madad chahiye?</h3>
  <p>Har hint <b>-25 pts</b> kaate gi. Bachi hui: <b>${left.length}</b></p>
  <div class="btn-row"><button class="btn btn-gold" id="m-hint">Hint lo (-25)</button><button class="btn btn-ghost" onclick="closeModal()">Rehne do</button></div>`);
  $("m-hint").onclick=()=>{
    const i=left[0]; S.hints.push(i); save(); closeModal(); renderProgress();
    openModal(`<span class="stamp gray">Hint ${S.hints.length}/3</span><div class="card" style="margin-top:10px;"><p style="font-size:15px; line-height:1.6;">💡 ${HINTS[i]}</p></div><div class="btn-row"><button class="btn" onclick="closeModal()">Samajh gaya</button></div>`);
  };
}
/* ---------- init ---------- */
if(typeof document!=="undefined"){
  $("modal-ov").addEventListener("click",e=>{ if(e.target.id==="modal-ov") closeModal(); });
  renderNav(); renderProgress(); show("brief");
}

</script>
</body>
</html>
